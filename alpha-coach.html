  if(best) return best;
  Object.keys(CATALOG).forEach(r=>{
    const n=CATALOG[r].name.toLowerCase();
    if(t.includes(n)&&n.length>bestLen){best=r;bestLen=n.length;}
  });
  return best;
}
function parseQty(text,ref){
  const it=ref?ensurePreview(ref):null;
  const m=text.match(/(-?\d+(?:[.,]\d+)?)\s*([a-z]+)?/);
  let n=null,unit=null;
  if(m){ n=parseFloat(m[1].replace(',','.')); unit=UNIT_WORDS[(m[2]||'').toLowerCase()]||null; }
  else{
    const w=text.toLowerCase().match(/\b(a|an|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|half)\b/);
    if(w) n=WORDNUM[w[1]];
    const u=text.toLowerCase().match(/\b(kg|g|grams?|ml|l|litres?|pieces?|pcs|packets?|containers?|scoops?|capsules?|tablets?|servings?)\b/);
    if(u) unit=UNIT_WORDS[u[1]]||null;
  }
  if(n==null) return null;
  if(!unit) unit=it?defaultUnitFor(it):'g';
  return {n,unit,base:toBase(n,unit,it)};
}
function parseTime(text){
  const t=text.toLowerCase();
  let m=t.match(/\bat\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
  if(m){
    let h=+m[1], mm=m[2]?+m[2]:0;
    const ap=m[3];
    if(ap==='pm'&&h<12) h+=12;
    if(ap==='am'&&h===12) h=0;
    if(!ap&&h<=6) h+=12;                       // "at 5" in the evening
    const d=new Date(now()); d.setHours(h,mm,0,0);
    let ts=d.getTime();
    if(ts>now()+6*3600e3) ts-=864e5;           // clearly meant earlier today
    return ts;
  }
  m=t.match(/(\d+)\s*(min|mins|minutes?|h|hr|hrs|hours?)\s+ago/);
  if(m){ const n=+m[1]; return now()-n*(/^h/.test(m[2])?3600e3:MIN); }
  if(/just now|right now|now\b/.test(t)) return now();
  if(/this morning/.test(t)){ const d=new Date(now()); d.setHours(8,0,0,0); return d.getTime(); }
  if(/an hour ago/.test(t)) return now()-3600e3;
  return null;
}
function findMealRef(text){
  const t=text.toLowerCase();
  const rows=activeRows();
  for(const r of rows){
    if(t.includes(r.meal.slot.toLowerCase())) return r;
    if(t.includes(r.meal.name.toLowerCase())) return r;
  }
  if(/\bsnack\b/.test(t)) return rows.find(r=>/snack|mid/i.test(r.meal.slot))||null;
  return null;
}

/* --- intent parsing ------------------------------------------------------ */
function splitClauses(text){
  return text.split(/\s*(?:,|;|\band then\b|\bthen\b|\band also\b|\balso\b|\band\b)\s*/i)
    .map(x=>x.trim()).filter(x=>x.length>2);
}
function parseClause(c){
  const t=c.toLowerCase();
  const ref=findRef(t);

  /* questions first, so "what do I have" never becomes an inventory write */
  if(/^(what|when|how|why|which|do i|am i|is there|show|tell)\b/.test(t)||/\?$/.test(t)){
    if(!IN_SCOPE.test(t)) return {kind:'unknown',text:c};   // stays an app, not a chatbot
    if(/point|score|streak|discipline|reward/.test(t)) return {kind:'query',topic:'points'};
    if(/inventory|stock|have|fridge|kitchen|ingredient/.test(t)) return {kind:'query',topic:'inventory'};
    if(/next|now|should i (eat|do)|due/.test(t)) return {kind:'query',topic:'next'};
    if(/schedule|day|times?/.test(t)) return {kind:'query',topic:'schedule'};
    if(/target|macro|protein|calorie|kcal|left|remaining/.test(t)) return {kind:'query',topic:'targets'};
    if(/why/.test(t)) return {kind:'query',topic:'why'};
    if(/short|buy|shopping|grocer/.test(t)) return {kind:'query',topic:'shortages'};
    if(/supplement|creatine|vitamin/.test(t)) return {kind:'query',topic:'supplements'};
    if(/workout|train|gym/.test(t)) return {kind:'query',topic:'workout'};
    if(/meal|eat|food|lunch|dinner|breakfast/.test(t)) return {kind:'query',topic:'meals'};
    return {kind:'query',topic:'next'};
  }

  if(/\bi (woke|got up)\b.*\bat\b|\bwoke up at\b/.test(t)) return {kind:'wake',at:parseTime(t)};
  if(/\bi('?m| am)? awake\b|\bwake( me)? up\b|\bgood morning\b|\bstart (my )?day\b/.test(t)) return {kind:'wake'};
  if(/\bslept\b|\bsleep\b|\bwent to bed\b/.test(t)){
    const h=t.match(/(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hours?)/);
    return {kind:'sleep',hours:h?parseFloat(h[1]):null};
  }
  if(/\bi weigh\b|\bweight is\b|\bweighed\b/.test(t)){
    const w=t.match(/(\d+(?:[.,]\d+)?)\s*(kg|kgs|kilos?|lbs?|pounds?)?/);
    if(w){ let n=parseFloat(w[1].replace(',','.')); if(/lb|pound/.test(w[2]||'')) n=Math.round(n*0.4536*10)/10; return {kind:'weight',kg:n}; }
  }
  /* "I ate 300 g of chicken" — food outside the plan */
  if(/\b(ate|had|eaten|drank)\b/.test(t)&&ref&&!/(breakfast|lunch|dinner|snack|meal)/.test(t)){
    const q=parseQty(t,ref);
    if(q) return {kind:'ateFood',ref,q};
  }
  if(/adjust|reschedule|shift|fix (the|my) (rest of )?day|rest of my day/.test(t)) return {kind:'adjust'};

  /* preferences */
  if(/(don'?t|do not|no longer|stop) (like|want|eat)|dislike|hate/.test(t)&&ref) return {kind:'pref',op:'dislike',ref};
  if(/\bi like\b|\blove\b|\bfavou?rite\b/.test(t)&&ref) return {kind:'pref',op:'like',ref};

  /* inventory */
  if(ref){
    if(/\bset\b.*\bto\b|\bcorrect\b|\bactually have\b/.test(t)){
      const q=parseQty(t,ref); if(q) return {kind:'inv',op:'set',ref,q};
    }
    if(/\b(bought|buy|purchased|add|got|picked up|restock)\b/.test(t)){
      const q=parseQty(t,ref)||{n:1,unit:defaultUnitFor(ensurePreview(ref)),base:(CATALOG[ref]||{pack:1}).pack};
      return {kind:'inv',op:'add',ref,q};
    }
    if(/\b(used|consumed|took|drank|ate up|finished off)\b/.test(t)){
      const q=parseQty(t,ref); if(q) return {kind:'inv',op:'use',ref,q};
    }
    if(/\b(remove|delete|throw|expired|finished|ran out|out of|no more|empty)\b/.test(t))
      return {kind:'inv',op:'remove',ref,risky:true};
  }

  /* meal actions */
  if(/\breplace\b|\bswap\b|\bsomething else\b|\bdifferent meal\b/.test(t)){
    const row=findMealRef(t)||nextRow();
    return {kind:'replaceMeal',row};
  }
  if(/\bskip\b/.test(t)){ const row=findMealRef(t)||nextRow(); return {kind:'skipMeal',row,risky:true}; }
  if(/\b(ate|eaten|had|finished|log|logged|done with)\b/.test(t)&&/(breakfast|lunch|dinner|snack|meal|shake|bowl|training)/.test(t)){
    const row=findMealRef(t)||nextRow();
    return {kind:'logMeal',row,ateAt:parseTime(t)};
  }
  if(/\bate out\b|\brestaurant\b|\btakeaway\b|\btakeout\b|\bordered\b/.test(t)) return {kind:'eatout'};
  if(/\bwater\b|\bdrank\b/.test(t)){ const q=parseQty(t,null); return {kind:'water',ml:q?(q.unit==='l'?q.n*1000:q.n):250}; }
  if(/\b(supplement|creatine|multivitamin|vitamin|omega|magnesium)\b/.test(t)&&/\b(took|take|taken|log)\b/.test(t))
    return {kind:'supp',ref:ref||'multivitamin'};
  if(/\bworkout\b|\btrained\b|\bgym\b/.test(t)&&/\b(did|done|finished|log|complete)\b/.test(t)) return {kind:'workout'};

  return {kind:'unknown',text:c};
}
function parseCommand(text){
  const clauses=splitClauses(text);
  const ops=clauses.map(parseClause);
  const useful=ops.filter(o=>o.kind!=='unknown');
  return useful.length?useful:[parseClause(text)];
}

/* The single inventory mutation used by the buttons, the quick-add bar and the
   chat alike. Scoring lives here, in the logging system — the conversational
   layer only ever calls this. */
function inventoryAction(ref, mode, baseAmt, note){
  const it=ensureItem(ref,{source:'user'});
  const before=it.qty;
  if(mode==='set') setQty(ref,baseAmt,note||'Set exact');
  else if(mode==='use') tx(ref,'subtract',-baseAmt,note||'Used');
  else if(mode==='zero') setQty(ref,0,note||'Marked finished');
  else{
    tx(ref,'purchase',baseAmt,note||'Added');
    Points.award('INVENTORY_UPDATED',{reason:`Recorded ${fmtQty(it.base,baseAmt)} of ${it.name.toLowerCase()}`,ref});
  }
  return {before, after:it.qty, it};
}

/* --- execution: every op routes through the normal app actions ------------ */
function runOps(ops){
  const lines=[];
  ops.forEach(o=>{
    try{ lines.push(runOp(o)); }
    catch(e){ lines.push(`I could not complete that one: ${esc(e.message)}`); }
  });
  return lines.filter(Boolean);
}
function runOp(o){
  const d=D();
  switch(o.kind){
    case 'wake':{
      if(d){
        if(o.at){
          const ts=Math.min(o.at,now());
          const prev=d.wake; d.wake=ts; d.key=dayKey(ts); save();
          const nx=nextRow();
          return `Wake time corrected ${fmtTime(prev)} → <b>${fmtTime(ts)}</b>. Every meal recalculated${nx?` — next is ${esc(nx.meal.name.toLowerCase())} at <b>${fmtTime(nx.at)}</b>`:''}.`;
        }
        return `Your day is already running — you woke at <b>${fmtTime(d.wake)}</b>.`;
      }
      ACT.wake();
      const dd=D();
      if(o.at&&o.at<now()){ dd.wake=o.at; dd.key=dayKey(o.at); save(); }
      return `Day started at <b>${fmtTime(D().wake)}</b>. First meal is set for <b>${fmtTime(nextRow().at)}</b>.`;
    }
    case 'inv':{
      const mode=o.op==='remove'?'zero':o.op;
      const r=inventoryAction(o.ref,mode,o.q?o.q.base:0,'Reported in chat');
      const extra=r.it.scoop?` (${tidy(r.after/r.it.scoop)} scoops)`:'';
      return `<b>${esc(r.it.name)}</b> ${r.before===r.after?'unchanged at':'updated'} ${fmtQty(r.it.base,r.before)} → <b>${fmtQty(r.it.base,r.after)}</b>${extra}.`;
    }
    case 'logMeal':{
      if(!d) return `Tap “I'm awake” first — I need a start time before meals can be logged.`;
      const row=o.row&&o.row.status==='pending'?o.row:nextRow();
      if(!row) return `Everything on today's plan is already resolved.`;
      if(!isOpen(row)) return `<b>${esc(row.meal.name)}</b> is still locked — ${esc(nextRow().meal.name.toLowerCase())} comes first.`;
      const ateAt=o.ateAt||now();
      const res=commitMeal({mealId:row.meal.id, ateAt, timeConfirmed:!!o.ateAt});
      if(!res.ok) return res.msg;
      const nx=nextRow();
      return `Logged <b>${esc(row.meal.name)}</b>, eaten at <b>${fmtTime(ateAt)}</b>${o.ateAt?'':' (assumed just now — tell me if it was earlier)'}. `+
        `${res.cls.mealOnTime?'Inside its window':'Outside its window'}, ${res.cls.logOnTime?'logged promptly':'logged '+dur(res.cls.logDelta)+' after eating'}. `+
        `${res.pts>=0?'+':''}${res.pts} points. ${nx?`Next is <b>${esc(nx.meal.name)}</b> at <b>${fmtTime(nx.at)}</b>.`:'That was the last meal of the day.'}`;
    }
    case 'skipMeal':{
      const row=o.row; if(!row) return `Nothing to skip.`;
      ACT.saveSkipDirect(row.meal.id,'reported in chat');
      const nx=nextRow();
      return `<b>${esc(row.meal.name)}</b> marked as skipped. ${nx?`Next is ${esc(nx.meal.name.toLowerCase())} at <b>${fmtTime(nx.at)}</b>.`:''}`;
    }
    case 'replaceMeal':{
      const row=o.row||nextRow(); if(!row) return `There is no upcoming meal to replace.`;
      const alts=[...(MEAL_LIBRARY[row.meal.id]||[]),...JUGAAD].filter(likedOk).filter(a=>!missingFor(a).length);
      if(!alts.length) return `I have nothing your kitchen can fully make as a replacement for <b>${esc(row.meal.name)}</b>. Open Inventory and I will work from what you add.`;
      alts.sort((a,b)=>scoreAlt(a,row.meal)-scoreAlt(b,row.meal));
      const alt=alts[0];
      applySwap(row.meal.id,alt,`You asked for a replacement`);
      return `Swapped <b>${esc(row.meal.name)}</b> → <b>${esc(alt.name)}</b> (${alt.p} g protein against ${row.meal.p} g). Everything it needs is in stock. The schedule time is unchanged.`;
    }
    case 'pref':{
      const list=o.op==='dislike'?'dislike':'like';
      const other=o.op==='dislike'?'like':'dislike';
      const a=S.prefs[list]||(S.prefs[list]=[]);
      if(!a.includes(o.ref)) a.push(o.ref);
      S.prefs[other]=(S.prefs[other]||[]).filter(x=>x!==o.ref);
      const affected=MEALS().filter(m=>(m.ing||[]).some(i=>i.ref===o.ref)).map(m=>m.name);
      return `Noted — <b>${esc(catName(o.ref))}</b> is now on your ${list} list.`+
        (o.op==='dislike'&&affected.length?` It appears in ${esc(affected.join(', ').toLowerCase())}; I will stop suggesting those and pick around it.`:' I will factor that into future suggestions.');
    }
    case 'water':{
      if(!d) return `Start your day first and I will track hydration against it.`;
      d.water=(d.water||0)+o.ml; save();
      return `Water logged: <b>${d.water} ml</b> today.`;
    }
    case 'supp':{
      if(!d) return `Start your day first.`;
      const sp=(S.suppPlan||[]).find(x=>x.ref===o.ref)||(S.suppPlan||[])[0];
      if(!sp) return `You have no supplements in your stack yet.`;
      const before=invQty(sp.ref);
      ACT.supp(sp.id);
      return `<b>${esc(catName(sp.ref))}</b> logged. Stock ${fmtQty(ensurePreview(sp.ref).base,before)} → <b>${fmtQty(ensurePreview(sp.ref).base,invQty(sp.ref))}</b>.`;
    }
    case 'workout':{
      const n=completeWorkout();
      return `Workout logged — all ${n} exercises marked complete. The logging system scored it at +${RULES.WORKOUT_ON_TIME.pts}.`;
    }
    case 'adjust':{
      if(!d) return `Nothing to adjust — your day has not started.`;
      const s=sched(), nx=nextRow();
      if(!nx) return `Everything is already resolved for today.`;
      return `Working from what has actually happened: next is <b>${esc(nx.meal.name)}</b> at <b>${fmtTime(nx.at)}</b>.`+
        (s.compressed?` Today is running late, so I tightened the flexible gaps — minimum spacing is untouched.`:` Spacing is comfortable, nothing needed compressing.`)+
        (s.overflow?` Even at minimum spacing not everything fits before your day closes; dropping ${esc(s.dropCandidate.name.toLowerCase())} is the cleanest fix.`:'');
    }
    case 'sleep':{
      if(o.hours==null) return `How many hours? Tell me “I slept 7 hours” and I will record it against today.`;
      S.sleepLog=S.sleepLog||[];
      S.sleepLog.push({at:now(),hours:o.hours,day:sessionKey()});
      save();
      return `Sleep logged: <b>${o.hours} h</b>. ${o.hours<6.5?'That is on the short side — expect appetite and training to feel it.':'Solid.'}`;
    }
    case 'weight':{
      if(!o.kg) return `Give me a number, like “I weigh 99.4 kg”.`;
      S.weights=S.weights||[];
      const prev=S.weights[S.weights.length-1];
      S.weights.push({at:now(),kg:o.kg});
      save();
      return prev
        ? `Weight logged: <b>${o.kg} kg</b> (last was ${prev.kg} kg, ${o.kg<prev.kg?'down':'up'} ${Math.abs(Math.round((o.kg-prev.kg)*10)/10)} kg).`
        : `Weight logged: <b>${o.kg} kg</b>. I will track the trend from here.`;
    }
    case 'ateFood':{
      if(!d) return `Start your day first and I will count it against today.`;
      const it=ensurePreview(o.ref);
      const before=invQty(o.ref);
      inventoryAction(o.ref,'use',o.q.base,'Eaten, reported in chat');
      const m=addExtra(d,o.ref,o.q.base);
      save();
      return `Recorded <b>${fmtQty(it.base,o.q.base)}</b> of ${esc(it.name.toLowerCase())} outside the plan — about ${m.kcal} kcal and ${m.p} g protein. `+
        `Stock ${fmtQty(it.base,before)} → <b>${fmtQty(it.base,invQty(o.ref))}</b>.`;
    }
    case 'eatout':{
      ACT.openEstimate(nextRow()?nextRow().meal.id:null);
      return `Opened the estimator — pick the closest dish and portion, or add a photo. It counts toward today either way.`;
    }
    case 'query': return answerQuery(o.topic);
    default:
      return null;
  }
}
function answerQuery(topic){
  const d=D();
  switch(topic){
    case 'points':{
      const pos=Points.positive(), neg=Points.negative();
      return `Today: <b>+${pos}</b> earned, <b>${neg}</b> deducted, net <b>${pos+neg}</b>. `+
        `Streak <b>${Points.streak()}</b> day${Points.streak()===1?'':'s'}. `+
        `Reward progress <b>${Points.towardReward()}/${REWARD_TARGET}</b>${Points.rewardReady()?' — a surprise recipe is ready to unlock.':'.'}`;
    }
    case 'inventory':{
      const have=invItems().filter(i=>i.qty>0);
      if(!have.length) return `Your inventory is empty. Tell me what you bought, or add items on the Inventory screen.`;
      return `You have ${have.slice(0,8).map(i=>`<b>${esc(i.name.toLowerCase())}</b> ${fmtQty(i.base,i.qty)}`).join(', ')}${have.length>8?` and ${have.length-8} more`:''}.`;
    }
    case 'next':{
      if(!d) return `Your day has not started. Tap “I'm awake” or just tell me you are up.`;
      const nx=nextRow();
      if(!nx) return `Nothing left — every meal is resolved for today.`;
      const st=stateOf(nx);
      return `<b>${esc(nx.meal.name)}</b> at <b>${fmtTime(nx.at)}</b> — ${st==='due'?'ready now':st==='overdue'?`${dur(now()-nx.at)} overdue`:`in ${dur(nx.at-now())}`}. `+
        `${nx.meal.kcal} kcal, ${nx.meal.p} g protein, about ${nx.meal.prepMin} minutes to prepare.`;
    }
    case 'schedule':{
      if(!d) return `No schedule yet — your day starts when you tell me you are awake.`;
      return `Awake since ${fmtTime(d.wake)}. `+activeRows().map(r=>`${esc(r.meal.slot.toLowerCase())} ${fmtTime(r.at)}${r.status==='done'?' ✓':''}`).join(', ')+'.';
    }
    case 'targets':{
      const eaten=eatenMacros();
      const k=eaten.kcal+(d&&d.extra?d.extra.kcal:0), pr=eaten.p+(d&&d.extra?d.extra.p:0);
      return `Logged so far: <b>${k}</b> of ${S.prefs.kcal} kcal and <b>${pr}</b> of ${S.prefs.protein} g protein. `+
        `<b>${Math.max(0,S.prefs.kcal-k)}</b> kcal and <b>${Math.max(0,S.prefs.protein-pr)}</b> g protein still to go.`;
    }
    case 'shortages':{
      const sh=shortages();
      if(!sh.length) return `Nothing is short — your kitchen covers the next day of meals.`;
      return sh.slice(0,4).map(x=>`<b>${esc(x.name.toLowerCase())}</b>: ${fmtQty(x.base,x.have)} left, ${fmtQty(x.base,x.need24)} needed, buy ${fmtQty(x.base,x.buy)}`).join('. ')+'.';
    }
    case 'supplements':{
      const plan=S.suppPlan||[];
      if(!plan.length) return `No supplements in your stack.`;
      return plan.map(sp=>`<b>${esc(catName(sp.ref))}</b> ${suppTakenToday(sp.id)?'taken':'not yet'}, ${fmtQty(ensurePreview(sp.ref).base,invQty(sp.ref))} left`).join('. ')+'.';
    }
    case 'workout':{
      const w=S.workout||{done:{}};
      const n=Object.values(w.done).filter(Boolean).length;
      return `Workout: <b>${n}/${EX.length}</b> exercises logged. Core stays isometric-first.`;
    }
    case 'why':{
      const nx=nextRow();
      if(!nx) return `Nothing is scheduled right now, so there is nothing to explain.`;
      const sw=appliedSwap(nx.meal.id);
      const base=`<b>${esc(nx.meal.name)}</b> is next because it follows ${nx.index===0?'your wake-up time':'the meal before it'} by the plan's spacing rule, and its ${nx.meal.p} g of protein keeps you on pace for ${S.prefs.protein} g.`;
      return sw?`${base} It replaced ${esc(sw.originalName.toLowerCase())} because ${esc(sw.missingText)}.`:base;
    }
    case 'meals':{
      if(!d) return `Your day has not started yet.`;
      return activeRows().map(r=>`${esc(r.meal.slot.toLowerCase())}: ${esc(r.meal.name.toLowerCase())} at ${fmtTime(r.at)}${r.status==='done'?' ✓':isLocked(r)?' (locked)':''}`).join('. ')+'.';
    }
  }
  return null;
}
const IN_SCOPE=/meal|eat|ate|food|breakfast|lunch|dinner|snack|inventory|stock|grocer|buy|shop|protein|calorie|kcal|macro|supplement|creatine|vitamin|workout|train|gym|water|sleep|wake|awake|schedule|plan|point|score|streak|reward|prep|recipe|like|dislike|allerg|weight|goal|chicken|egg|rice|paneer|oats|dal|lentil|yogurt|curd|whey|banana|spinach|salad|day|time|log/i;

  const st=stateOf(nx);
  if(st==='overdue') return 'overdue';
  if(st==='due') return 'due';
  if(st==='soon') return 'soon';
  const done=activeRows().filter(r=>r.status==='done').length;
  return done===0?'morning':'waiting';
}

/* four axes of the day, drawn as concentric arcs */
function dayAxes(){
  const d=D();
  const rows=d?activeRows():[];
  const meals=rows.length?rows.filter(r=>r.status==='done').length/rows.length:0;
  const water=d?clamp((d.water||0)/PLAN.targets.water,0,1):0;
  const plan=S.suppPlan||[];
  const supp=plan.length?plan.filter(x=>suppTakenToday(x.id)).length/plan.length:0;
  const w=S.workout||{done:{}};
  const train=EX.length?Object.values(w.done).filter(Boolean).length/EX.length:0;
  return [
    {k:'Meals',v:meals,c:'var(--accent)'},
    {k:'Water',v:water,c:'#6FA8CF'},
    {k:'Supplements',v:supp,c:'#B39DE0'},
    {k:'Training',v:train,c:'var(--ember)'}
  ];
}
function DayRing(size=176){
  const axes=dayAxes();
  const overall=Math.round(axes.reduce((a,x)=>a+x.v,0)/axes.length*100);
  const cx=size/2, cy=size/2;
  const radii=[size/2-9, size/2-25, size/2-41, size/2-57];
  const arcs=axes.map((a,i)=>{
    const r=radii[i], c=2*Math.PI*r;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${a.c}" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c-(c*clamp(a.v,0,1))}"
        transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dashoffset 900ms var(--ease-out)"/>`;
  }).join('');
  return `<div class="dayring">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Day completion ${overall} percent">
      ${arcs}
      <text x="${cx}" y="${cy+2}" text-anchor="middle" dominant-baseline="middle"
        style="font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.05em;fill:var(--ink)">${overall}%</text>
      <text x="${cx}" y="${cy+22}" text-anchor="middle"
        style="font-family:var(--f-ui);font-size:10.5px;font-weight:600;fill:var(--muted)">of today</text>
    </svg>
    <div class="ring-legend">
      ${axes.map(a=>`<div class="ring-leg"><span class="ring-dot" style="background:${a.c}"></span>
        <span>${a.k}</span><span class="ring-val">${Math.round(a.v*100)}%</span></div>`).join('')}
    </div>
  </div>`;
}

/* the last seven sessions, scored */
function WeekBars(){
  const keys=[...new Set(S.points.ledger.map(e=>e.day))].sort().slice(-7);
  const today=sessionKey();
  if(!keys.length) keys.push(today);
  const vals=keys.map(k=>({k,v:Points.dayScore(k)}));
  const max=Math.max(40,...vals.map(x=>Math.abs(x.v)));
  const pad=Array.from({length:Math.max(0,7-vals.length)},()=>null);
  const all=[...pad,...vals];
  return `<div class="weekbars">
    ${all.map(x=>{
      if(!x) return `<div class="wb empty"><div class="wb-col" style="height:14%"></div><span class="wb-d">–</span></div>`;
      const h=clamp(Math.abs(x.v)/max*100,6,100);
      const on=x.k===today;
      const lbl=new Date(x.k+'T12:00:00').toLocaleDateString([], {weekday:'short'});
      return `<div class="wb ${on?'on':''}">
        <div class="wb-col" style="height:${h}%">${on?`<span class="wb-cap">${x.v>0?'+':''}${x.v}</span>`:''}</div>
        <span class="wb-d">${lbl}</span></div>`;
    }).join('')}
  </div>`;
}

function TomorrowWindow(d){

  return `<section class="card">

    <div class="stack s">

          </div>
        </div>`).join('')}
    </div>
    ${tonight.length?`<div class="banner" style="margin-top:14px">${ic('moon',18,1.7,'var(--accent)')}<p>You can get ahead tonight on ${tonight.map(m=>m.name.toLowerCase()).join(', ')} — all of them store safely overnight.</p></div>`:''}
    <div class="sep" style="margin:16px 0 12px"></div>
    <div class="label" style="margin-bottom:9px">Combined ingredient checklist</div>
    ${ItemList(items)}
    <button class="btn ${allChecked?'primary':'dark'} block" style="margin-top:16px" data-act="tprepdone">
      ${allChecked?ic('check',17):''} ${d.tomorrowPrepDone?'Tomorrow is ready':'Mark tomorrow’s prep complete'}</button>
  </section>`;
}
function mergeItems(meals){
  const map=new Map();
  meals.forEach(m=>mealItems(m).forEach(it=>{
    const k=it.n.toLowerCase();
    if(map.has(k)) map.get(k).qs.push(it.q); else map.set(k,{n:it.n,qs:[it.q]});
  }));
  return [...map.values()].map(v=>({n:v.n,q:v.qs.join(' + ')}));
}

function refillDate(ref,dose){
  const q=invQty(ref); if(!dose||q<=0) return null;
  return now()+Math.floor(q/dose)*864e5;
}

function WeightTrend(){
  const w=(S.weights||[]).slice(-30);
  if(w.length<2) return `<section class="card">
    <div class="label" style="margin-bottom:8px">Weight trend</div>
    <p class="talk" style="color:var(--muted);font-size:14px">Log your weight twice and the trend appears here. It is the only honest answer to “is this working”.</p>
    <button class="btn primary sm" style="margin-top:12px" data-act="modal" data-v="weight">Log a weigh-in</button></section>`;
  const W=560,H=150,P=10;
  const ks=w.map(x=>x.kg), min=Math.min(...ks)-.6, max=Math.max(...ks)+.6;
  const x=i=>P+(i/(w.length-1))*(W-P*2);
  const y=v=>P+(1-(v-min)/(max-min))*(H-P*2);
  const pts=w.map((d,i)=>`${x(i).toFixed(1)},${y(d.kg).toFixed(1)}`).join(' ');
  const area=`M${x(0)},${y(w[0].kg)} L${pts.split(' ').join(' L')} L${x(w.length-1)},${H-P} L${x(0)},${H-P} Z`;
  const first=w[0].kg, last=w[w.length-1].kg, diff=Math.round((last-first)*10)/10;
  // seven-day average, the number that actually matters
  const avg=n=>{const t=w.slice(-n);return Math.round(t.reduce((a,b)=>a+b.kg,0)/t.length*10)/10;};
  return `<section class="card">
    <div class="spread" style="margin-bottom:12px">
      <div><span class="label">Weight trend</span>
        <div class="num" style="font-size:24px;margin-top:6px">${last} kg</div></div>
      <div style="text-align:right">
        <span class="pillbadge ${diff<0?'lime':'peach'}">${diff<0?'▼':'▲'} ${Math.abs(diff)} kg</span>
        <div class="meta" style="margin-top:6px">7-day avg ${avg(7)} kg</div></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:150px;display:block">
      <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/>
        <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      ${[0,.5,1].map(f=>`<line x1="0" x2="${W}" y1="${P+f*(H-P*2)}" y2="${P+f*(H-P*2)}" stroke="var(--line)"/>`).join('')}
      <path d="${area}" fill="url(#wg)"/>
      <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${x(w.length-1)}" cy="${y(last)}" r="5" fill="var(--accent)" stroke="#fff" stroke-width="2.5"/>
    </svg>
    <p class="talk" style="font-size:12.5px;color:var(--muted);margin-top:8px">
      Judge by the 7-day average, not the morning number — daily swings of a kilo are water.</p>
  </section>`;
}

function StatusTag(st){ return `<span class="tag ${STATUS_TAG[st]}">${STATUS_LABEL[st]}</span>`; }
function stepFor(it){ return it.scoop||it.serving||1; }

function InvCard(it,extra=''){
  const st=statusOf(it.ref), dl=daysLeft(it.ref), nu=nextUse(it.ref), use=dailyUse(it.ref);
  return `<div class="card pad-s" data-inv="${it.ref}">
    <div class="spread" style="align-items:flex-start;gap:10px">
      <div style="min-width:0">
        <div class="meal-name" style="font-size:15px">${esc(it.name)}</div>
        <div class="meta" style="margin-top:2px;text-transform:capitalize">${esc(it.cat)}${it.location?' · '+esc(it.location):''}${it.source==='user'?' · yours':''}</div>
      </div>
      <div style="text-align:right;flex:0 0 auto">
        <div class="num" style="font-size:18px">${fmtQty(it.base,it.qty)}</div>
        <div class="meta" style="margin-top:2px">${servingText(it)}</div>
      </div>
    </div>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:10px">${StatusTag(st)}
      ${use?`<span class="tag mute">${fmtQty(it.base,use)}/day</span>`:''}
      ${dl!=null?`<span class="tag mute">${dl} day${dl===1?'':'s'} left</span>`:''}
      ${it.expiry?`<span class="tag ${it.expiry-now()<3*864e5?'warn':'mute'}">Expires ${fmtDay(it.expiry)}</span>`:''}
    </div>
    ${nu?`<p class="talk" style="margin-top:9px;font-size:13px;color:var(--muted)">Next used in ${esc(nu.meal.name.toLowerCase())} at ${fmtTime(nu.at)}.</p>`:''}
    ${extra}
    <div class="row" style="gap:7px;margin-top:12px;flex-wrap:wrap">
      <button class="iconbtn" style="width:34px;height:34px" data-act="qstep" data-v="${it.ref}" data-n="-1" aria-label="Decrease">${ic('x',14)}</button>
      <span class="meta" style="min-width:70px;text-align:center">${fmtQty(it.base,stepFor(it))} step</span>
      <button class="iconbtn" style="width:34px;height:34px" data-act="qstep" data-v="${it.ref}" data-n="1" aria-label="Increase">${ic('plus',14)}</button>
      <button class="btn xs" data-act="modal" data-v="item" data-arg="${it.ref}">${ic('edit',13)} Edit</button>
      <button class="btn xs" data-act="modal" data-v="restock" data-arg="${it.ref}">${ic('plus',13)} Restock</button>
    </div>
  </div>`;
}

function frequentRefs(){
  const counts={};
  invItems().forEach(i=>counts[i.ref]=(i.tx||[]).length);
  return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,6);
}
function recentRefs(){
  return allTx().slice(0,20).map(t=>t.ref).filter((v,i,a)=>a.indexOf(v)===i).slice(0,6);
}
function invGroup(ref){
  const st=statusOf(ref);
  if(st==='out') return 'out';
  if(st==='low'||st==='refill1d'||st==='expiring') return 'low';
  return 'have';
}
function QuickRow(it){
  const st=statusOf(it.ref), dl=daysLeft(it.ref);
  return `<div class="qrow" data-inv="${it.ref}">
    <div style="flex:1;min-width:0">
      <div class="qname">${esc(it.name)}</div>
      <div class="meta">${fmtQty(it.base,it.qty)}${it.scoop?` · ${tidy(it.qty/it.scoop)} scoops`:''}${dl!=null?` · ${dl} day${dl===1?'':'s'} left`:''}</div>
    </div>
    <div class="qctl">
      <button class="qbtn" data-act="qstep" data-v="${it.ref}" data-n="-1" aria-label="Less">−</button>
      <button class="qbtn" data-act="qstep" data-v="${it.ref}" data-n="1" aria-label="More">+</button>
      <button class="qbtn wide" data-act="modal" data-v="quickadd" data-arg="${it.ref}">Set</button>
      <button class="qbtn ghost" data-act="modal" data-v="item" data-arg="${it.ref}" aria-label="Details">${ic('chev',14)}</button>
    </div>
  </div>`;
}
function InventoryOff(title,body){

      <div class="row" style="gap:8px;margin-top:14px;flex-wrap:wrap">

  return `<div class="screen">

        <div class="spread" style="padding:12px 0;border-top:1px solid var(--line);gap:10px;align-items:flex-start">
          <div style="min-width:0"><div class="meal-name" style="font-size:15px">${esc(m.name)}</div>
            <div class="meta" style="margin-top:2px">${esc(m.slot)} · ${m.kcal} kcal · ${m.p}g protein</div>
            ${m.swappedFrom?`<div class="meta" style="margin-top:3px;color:var(--accent-ink)">Swapped from ${esc(m.swappedFrom)}</div>`:''}</div>
          <button class="btn xs" data-act="modal" data-v="swap" data-arg="${m.id}">${ic('swap',13)} Replace</button>
        </div>`).join('')}
    </section>
  </div></div>`;
}

/* ===========================================================================
   MODALS
   =========================================================================== */
function Overlay(){
  const m=S.ui.modal; if(!m) return '';
  const arg=S.ui.modalArg;
  const meal=arg?MEALS().find(x=>x.id===arg):null;
  const body={
    reminders(){
      const d=D(), rs=d?[...d.reminders].reverse():[];
      return `<div class="modal-h"><div><h2 style="font-size:19px">Reminders</h2>
        <p class="meta" style="margin-top:4px">Every nudge from today, newest first</p></div>
        <button class="modal-x" data-act="close" aria-label="Close">${ic('x',16)}</button></div>
        ${rs.length?rs.map(r=>`<div class="row" style="align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--line)">
          ${ic(r.kind.startsWith('late')?'alert':r.kind==='due'?'bell':'clock',17,1.7,r.kind.startsWith('late')?'var(--warn)':'var(--accent)')}
          <div style="flex:1"><p class="talk" style="font-size:14px;color:var(--ink-2)">${esc(r.text)}</p>
          <div class="meta" style="margin-top:3px">${fmtTime(r.at)}</div></div></div>`).join('')
          :`<p class="talk" style="color:var(--muted);font-size:14px">Nothing yet today. I will nudge you before each meal and again when it is time.</p>`}`;
    },
    replace(){
      return `<div class="modal-h"><div><h2 style="font-size:19px">What did you eat instead?</h2>
        <p class="meta" style="margin-top:4px">Replacing ${esc(meal.name)}</p></div>
        <button class="modal-x" data-act="close" aria-label="Close">${ic('x',16)}</button></div>
        <p class="talk" style="font-size:14px;color:var(--muted);margin-bottom:14px">No problem — record it and I will recalculate the rest of the day from this point.</p>
        <button class="btn primary block" style="margin:0 0 12px" data-act="openEstimate" data-v="${meal.id}">
          ${ic('sparkleIcon',16)} Estimate it from a photo or a dish</button>
        ${eatTimeControl('repEatTime',meal.id)}
        <div class="label" style="margin:14px 0 8px">Or write it down</div>
        <label class="field"><span>What you ate</span><input class="input" id="repName" placeholder="e.g. chicken wrap and a coffee"></label>
        <div class="grid g2" style="gap:0 12px">
          <label class="field"><span>Calories</span><input class="input" id="repKcal" type="number" inputmode="numeric" placeholder="${meal.kcal}"></label>
          <label class="field"><span>Protein (g)</span><input class="input" id="repP" type="number" inputmode="numeric" placeholder="${meal.p}"></label>
        </div>
        <button class="btn block" data-act="saveReplace" data-v="${meal.id}">Save eaten at ${eatTimeLabel('repEatTime')}</button>`;
    },
    skip(){
      return `<div class="modal-h"><div><h2 style="font-size:19px">Skip this meal?</h2>
        <p class="meta" style="margin-top:4px">${esc(meal.name)}</p></div>
        <button class="modal-x" data-act="close" aria-label="Close">${ic('x',16)}</button></div>
        <p class="talk" style="font-size:14px;color:var(--muted);margin-bottom:14px">Tell me why so the rest of the day is adjusted sensibly. No judgement — this is just data.</p>
        <div class="row" style="gap:7px;flex-wrap:wrap;margin-bottom:14px">
          ${SKIP_REASONS.map(r=>`<button class="chip" data-act="pickReason" data-v="${esc(r)}" aria-pressed="${S.ui.reason===r}">${r}</button>`).join('')}
        </div>
        <label class="field"><span>Anything else</span><input class="input" id="skipNote" placeholder="Optional"></label>
        <div class="row" style="gap:8px">
          <button class="btn ghost" data-act="close">Cancel</button>
          <button class="btn dark" style="flex:1" data-act="saveSkip" data-v="${meal.id}">Mark as skipped</button></div>`;
    },

    /* ---- confirm what was actually eaten, then deduct ---- */
    eat(){
      const mm=mealById(arg)||meal;
      const its=mealItems(mm);
      return `<div class="modal-h"><div><h2 style="font-size:19px">Confirm what you ate</h2>
        <p class="meta" style="margin-top:4px">${esc(mm.name)} · adjust anything that was different</p></div>
        <button class="modal-x" data-act="close" aria-label="Close">${ic('x',16)}</button></div>
        <p class="talk" style="font-size:13.5px;color:var(--muted);margin-bottom:14px">
          Inventory is only deducted once you confirm — never when a meal is merely planned or prepared.</p>
        ${eatTimeControl('eatTime',mm.id)}
        <div class="stack s">
        ${its.map(i=>{
          const have=invQty(i.ref), short=have<i.amt;
          return `<div class="row" style="align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)">
            <button class="chk" data-act="togEat" data-v="${i.ref}" role="checkbox" aria-checked="${S.ui.eatSkip&&S.ui.eatSkip[i.ref]?'false':'true'}">${ic('check',14,2.6,'#fff')}</button>
            <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">${esc(i.n)}</div>
              <div class="meta" style="margin-top:2px">In stock ${fmtQty(i.base,have)}${short?' · not enough recorded':''}</div></div>
            <input class="input" style="width:96px;height:38px;text-align:right" type="number" step="any" data-eatamt="${i.ref}" value="${(S.ui.eatAmt&&S.ui.eatAmt[i.ref]!=null)?S.ui.eatAmt[i.ref]:i.amt}">
            <span class="meta" style="width:34px">${i.base}</span>
          </div>`;
        }).join('')}
        </div>
        ${its.some(i=>invQty(i.ref)<i.amt)?`<div class="banner warn" style="margin-top:14px">${ic('alert',17,1.7,'var(--warn)')}
          <p>Some items are below the amount recorded. I will take them to zero and flag it so you can correct the count.</p></div>`:''}
        <button class="btn primary block lg" style="margin-top:16px" data-act="confirmEat" data-v="${mm.id}">${ic('check',17)} Log ${esc(mm.slot.toLowerCase())} eaten at ${eatTimeLabel('eatTime')}</button>
        <button class="btn ghost block" style="margin-top:8px" data-act="confirmEat" data-v="${mm.id}" data-arg="nodeduct">Log without changing inventory</button>`;
    },

    /* ---- add / edit an inventory item ---- */
    item(){
      const it=arg?inv(arg):null;
      const c=arg?(CATALOG[arg]||{}):{};
      const base=it?it.base:(c.base||'g');
      const opts=UNIT_OPTS[base]||['g'];
      const unseen=Object.keys(CATALOG).filter(r=>!S.inv.items[r]);
      return `<div class="modal-h"><div><h2 style="font-size:19px">${it?'Edit item':'Add item'}</h2>
        <p class="meta" style="margin-top:4px">${it?esc(it.name):'Pick from your plan or add your own'}</p></div>
        <button class="modal-x" data-act="close" aria-label="Close">${ic('x',16)}</button></div>
        ${!it?`<label class="field"><span>Item</span><select class="input" id="itRef">
          ${unseen.map(r=>`<option value="${r}">${esc(CATALOG[r].name)}</option>`).join('')}
          <option value="__custom">Something else…</option></select></label>
          <label class="field"><span>Custom name (if not listed)</span><input class="input" id="itName" placeholder="e.g. Peanut butter"></label>`:''}
        <div class="grid g2" style="gap:0 12px">
          <label class="field"><span>Quantity</span><input class="input" id="itQty" type="number" step="any" value="${it?tidy(it.qty):''}" placeholder="0"></label>
          <label class="field"><span>Unit</span><select class="input" id="itUnit">${opts.map(u=>`<option value="${u}" ${u===base?'selected':''}>${UNITS[u].label}</option>`).join('')}</select></label>
          <label class="field"><span>Package size (${base})</span><input class="input" id="itPack" type="number" step="any" value="${it?it.pack:(c.pack||'')}"></label>
          <label class="field"><span>Serving size (${base})</span><input class="input" id="itServing" type="number" step="any" value="${it?it.serving:(c.serving||'')}"></label>
          <label class="field"><span>Scoop size (${base})</span><input class="input" id="itScoop" type="number" step="any" value="${it&&it.scoop?it.scoop:(c.scoop||'')}" placeholder="if applicable"></label>
          <label class="field"><span>Pieces / capsules per pack</span><input class="input" id="itCount" type="number" step="any" value="${it&&it.count?it.count:''}" placeholder="optional"></label>
          <label class="field"><span>Expiry date</span><input class="input" id="itExp" type="date" value="${it&&it.expiry?new Date(it.expiry).toISOString().slice(0,10):''}"></label>
          <label class="field"><span>Storage location</span><select class="input" id="itLoc">
            ${['Fridge','Freezer','Pantry','Shelf','Counter','Other'].map(l=>`<option ${it&&it.location===l?'selected':''}>${l}</option>`).join('')}</select></label>
        </div>
        <button class="btn primary block" data-act="saveItem" data-v="${arg||''}">${it?'Save changes':'Add to inventory'}</button>
        ${it?`<div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">
          <button class="btn sm" data-act="markOut" data-v="${arg}">Mark out of stock</button>
          <button class="btn sm" data-act="markExp" data-v="${arg}">Mark expired</button>
          <button class="btn sm ghost" style="color:var(--accent-ink)" data-act="delItem" data-v="${arg}">Delete item</button></div>`:''}`;
    },

    /* ---- restock: add to what is left, or correct the count ---- */
    restock(){
      const it=ensurePreview(arg);
      const opts=UNIT_OPTS[it.base]||['g'];
      return `<div class="modal-h"><div><h2 style="font-size:19px">Restock ${esc(it.name)}</h2>
        <p class="meta" style="margin-top:4px">Currently ${fmtQty(it.base,it.qty)}${it.scoop?` · ${tidy(it.qty/it.scoop)} scoops`:''}</p></div>
        <button class="modal-x" data-act="close" aria-label="Close">${ic('x',16)}</button></div>
        <div class="grid g2" style="gap:0 12px">
          <label class="field"><span>Amount</span><input class="input" id="rsQty" type="number" step="any" value="${it.pack?tidy(fromBase(it.pack,defaultUnitFor(it),it)):1}"></label>
          <label class="field"><span>Unit</span><select class="input" id="rsUnit">${opts.map(u=>`<option value="${u}" ${u===defaultUnitFor(it)?'selected':''}>${UNITS[u].label}</option>`).join('')}</select></label>
        </div>
        <div class="banner" style="margin-bottom:14px">${ic('plus',17,1.7,'var(--accent)')}
          <p>Adding stacks on top of what is left. If you are correcting a wrong count instead, use replace.</p></div>
        <button class="btn primary block" data-act="doRestock" data-v="${it.ref}" data-arg="add">Add to current quantity</button>
        <button class="btn block" style="margin-top:9px" data-act="doRestock" data-v="${it.ref}" data-arg="replace">Replace current quantity</button>`;
    },

    /* ---- shopping: confirm the purchased amount before it enters inventory ---- */
    buy(){
      const it=ensurePreview(arg);
      const suggested=buyQty(arg)||it.pack||1;
      const opts=UNIT_OPTS[it.base]||['g'];
      return `<div class="modal-h"><div><h2 style="font-size:19px">Confirm purchase</h2>
        <p class="meta" style="margin-top:4px">${esc(it.name)} · you have ${fmtQty(it.base,it.qty)}</p></div>
        <button class="modal-x" data-act="close" aria-label="Close">${ic('x',16)}</button></div>
        <div class="grid g2" style="gap:0 12px">
          <label class="field"><span>Amount purchased</span><input class="input" id="byQty" type="number" step="any" value="${tidy(fromBase(suggested,defaultUnitFor(it),it))}"></label>
          <label class="field"><span>Unit</span><select class="input" id="byUnit">${opts.map(u=>`<option value="${u}" ${u===defaultUnitFor(it)?'selected':''}>${UNITS[u].label}</option>`).join('')}</select></label>
        </div>
        <label class="field"><span>Expiry (optional)</span><input class="input" id="byExp" type="date"></label>
        <button class="btn primary block" data-act="doBuy" data-v="${arg}">Add to inventory</button>`;
    },

    shopqty(){
      const it=ensurePreview(arg);
      const opts=UNIT_OPTS[it.base]||['g'];
      const cur=(S.shop[arg]&&S.shop[arg].qty!=null)?S.shop[arg].qty:buyQty(arg);
      return `<div class="modal-h"><div><h2 style="font-size:19px">Purchase quantity</h2>
        <p class="meta" style="margin-top:4px">${esc(it.name)}</p></div>
        <button class="modal-x" data-act="close" aria-label="Close">${ic('x',16)}</button></div>
        <div class="grid g2" style="gap:0 12px">
          <label class="field"><span>Buy</span><input class="input" id="sqQty" type="number" step="any" value="${tidy(fromBase(cur,defaultUnitFor(it),it))}"></label>
          <label class="field"><span>Unit</span><select class="input" id="sqUnit">${opts.map(u=>`<option value="${u}" ${u===defaultUnitFor(it)?'selected':''}>${UNITS[u].label}</option>`).join('')}</select></label>
        </div>
        <button class="btn primary block" data-act="saveShopQty" data-v="${arg}">Save quantity</button>`;
    },

    sub(){
      const c=CATALOG[arg]||{subs:[]};
      return `<div class="modal-h"><div><h2 style="font-size:19px">Use a substitute</h2>
        <p class="meta" style="margin-top:4px">Instead of ${esc(catName(arg))}</p></div>
        <button class="modal-x" data-act="close" aria-label="Close">${ic('x',16)}</button></div>
        <div class="stack s">
        ${(c.subs||[]).map(sref=>{
          const q=invQty(sref);
          return `<button class="pick-row card pad-s" data-act="pickSub" data-v="${arg}" data-arg="${sref}" style="width:100%;text-align:left;display:block">
            <div class="spread"><div><div style="font-weight:600;font-size:14.5px">${esc(catName(sref))}</div>
              <div class="meta" style="margin-top:2px">${q>0?`${fmtQty((CATALOG[sref]||{base:'g'}).base,q)} at home`:'Not in your inventory'}</div></div>
              <span class="tag ${q>0?'ok':'mute'}">${q>0?'Available':'Would need buying'}</span></div></button>`;
        }).join('')||`<p class="talk" style="color:var(--muted);font-size:14px">No substitutes are defined for this item.</p>`}
        </div>`;
    },

    /* the reward reveal */
    reward(){
      const r=S.points.pending||pickSurprise();
      if(!r) return `<div class="modal-h"><div><h2 style="font-size:19px">No new recipe right now</h2></div>
        <button class="modal-x" data-act="close">${ic('x',16)}</button></div>
        <p class="talk">You have unlocked everything that fits your restrictions for now. More arrive as the library grows.</p>`;
      const stock=surpriseStock(r), missing=stock.filter(x=>!x.ok);
      return `<div class="reward-reveal">
        <div class="reward-burst">${ic('sparkleIcon',34,1.6,'#fff')}</div>
        <span class="label" style="color:var(--accent)">Surprise unlocked</span>
        <h2 class="reward-name">${esc(r.name)}</h2>
        <p class="talk reward-blurb">${esc(r.blurb)}</p>
        <div class="reward-macros">
          <div><b>${r.kcal}</b><span>kcal</span></div><div><b>${r.p} g</b><span>protein</span></div>
          <div><b>${r.c} g</b><span>carbs</span></div><div><b>${r.f} g</b><span>fat</span></div>
          <div><b>${r.prepMin}</b><span>min</span></div>
        </div>
        <div class="reward-why">${ic('sparkleIcon',15,1.7,'var(--accent)')}<p class="talk">${esc(r.why)}</p></div>
        <div class="label" style="margin:16px 0 8px">Ingredients</div>
        <div class="stack s">${stock.map(x=>`<div class="spread" style="font-size:13.5px">
          <span>${esc(x.name)}</span>
          <span class="row" style="gap:8px"><span class="meta">${fmtQty(x.base,x.amt)}</span>
          <span class="tag ${x.ok?'ok':'warn'}">${x.ok?'in stock':`need ${fmtQty(x.base,x.amt-x.have)}`}</span></span></div>`).join('')}</div>
        ${missing.length?`<div class="banner warn" style="margin-top:12px">${ic('alert',17,1.7,'var(--warn)')}
          <p>${missing.length} item${missing.length>1?'s are':' is'} missing. Saving it will not add anything to your day automatically.</p></div>`:''}
        <div class="label" style="margin:16px 0 8px">Method</div>
        <ol class="talk" style="margin:0;padding-left:17px;font-size:13.5px;color:var(--ink-2);display:grid;gap:6px">
          ${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
        <p class="talk" style="font-size:13px;color:var(--muted);margin-top:14px">
          This is an offer, not a task. Nothing is logged and nothing is lost if you skip it.</p>
        <div class="row" style="gap:8px;margin-top:14px;flex-wrap:wrap">
          <button class="btn primary" style="flex:1" data-act="rewardChoice" data-v="make" data-arg="${r.id}">Make this</button>
          <button class="btn" data-act="rewardChoice" data-v="save" data-arg="${r.id}">Save for later</button>
          <button class="btn ghost" data-act="rewardChoice" data-v="no" data-arg="${r.id}">Not interested</button>
        </div>
        ${missing.length?`<button class="btn block" style="margin-top:9px" data-act="rewardShop" data-arg="${r.id}">Add missing items to shopping list</button>`:''}
      </div>`;
    },

    /* why a meal was replaced */
    swapinfo(){
      const d=D(), sw=d&&d.autoSwap?d.autoSwap[arg]:null;
      if(!sw) return `<div class="modal-h"><div><h2 style="font-size:19px">No replacement</h2></div>
        <button class="modal-x" data-act="close">${ic('x',16)}</button></div><p class="talk">This meal is the original plan.</p>`;
      return `<div class="modal-h"><div><h2 style="font-size:19px">Why this meal changed</h2>
        <p class="meta" style="margin-top:4px">Nothing was swapped silently</p></div>
        <button class="modal-x" data-act="close">${ic('x',16)}</button></div>
        <div class="swapflow">
          <div class="swapcell"><span class="label">Originally planned</span><b>${esc(sw.originalName)}</b></div>
          <div class="swaparrow">${ic('chev',18,2,'var(--accent)')}</div>
          <div class="swapcell alt"><span class="label" style="color:var(--accent)">Now</span><b>${esc(sw.altName)}</b></div>
        </div>
        <div class="banner warn" style="margin-top:14px">${ic('alert',17,1.7,'var(--warn)')}
          <p>Reason: ${esc(sw.missingText)}.</p></div>
        ${sw.reason?`<p class="talk" style="margin-top:12px;font-size:13.5px;color:var(--ink-2)">${esc(sw.reason)}</p>`:''}
        <div class="label" style="margin:16px 0 8px">Ingredients it will use</div>
        ${ItemList((sw.uses||[]).map(u=>({n:u.name,q:fmtQty(u.base,u.amt)})))}
        <div class="row" style="gap:8px;margin-top:16px">
          <button class="btn" style="flex:1" data-act="keepOriginal" data-v="${arg}">Keep the original instead</button>
          <button class="btn primary" data-act="close">Fine by me</button>
        </div>`;
    },

    /* correct the ACTUAL eating time of one logged meal */
    edittime(){
      const d=D(), log=d?d.logs[arg]:null, m=mealById(arg);
      if(!log) return `<p class="talk">Not logged yet.</p>`;
      const ate=log.ateAt||log.at;
      const hh=String(new Date(ate).getHours()).padStart(2,'0'), mm=String(new Date(ate).getMinutes()).padStart(2,'0');
      const rows=activeRows(), i=rows.findIndex(r=>r.meal.id===arg);
      const after=rows.slice(i+1).filter(r=>r.status==='pending');
      return `<div class="modal-h"><div><h2 style="font-size:19px">When did you actually eat it?</h2>
        <p class="meta" style="margin-top:4px">${esc(m.name)}</p></div>
        <button class="modal-x" data-act="close">${ic('x',16)}</button></div>
        <p class="talk" style="font-size:13.5px;color:var(--muted);margin-bottom:14px">
          You entered this at ${fmtTime(log.loggedAt||ate)}. The eating time is what the rest of your day is built on, so correcting it moves the meals after this one.</p>
        <label class="field"><span>Actual eating time</span><input class="input" id="etTime" type="time" value="${hh}:${mm}"></label>
        ${after.length?`<div class="banner" style="margin-bottom:14px">${ic('clock',17,1.7,'var(--accent)')}
          <p>${after.length} later meal${after.length>1?'s':''} will be recalculated. ${esc(after[0].meal.name)} is currently at ${fmtTime(after[0].at)}.</p></div>`:''}
        <button class="btn primary block" data-act="saveAteTime" data-v="${arg}">Save actual time</button>
        <p class="talk" style="font-size:12.5px;color:var(--muted);margin-top:10px">One meal at a time — the rest of the sequence updates itself.</p>`;
    },

    /* one-tap quantity for a single item */
    quickadd(){
      const it=ensurePreview(arg);
      const u=defaultUnitFor(it);
      const presets=it.base==='pcs'?[1,2,6,12]:it.scoop?[it.scoop,it.scoop*5,it.pack/2,it.pack]:
        it.base==='g'||it.base==='ml'?[100,250,500,it.pack]:[1,5,10,30];
      return `<div class="modal-h"><div><h2 style="font-size:19px">${esc(it.name)}</h2>
        <p class="meta" style="margin-top:4px">Now ${fmtQty(it.base,it.qty)}${it.scoop?` · ${tidy(it.qty/it.scoop)} scoops`:''}</p></div>
        <button class="modal-x" data-act="close">${ic('x',16)}</button></div>
        <div class="row" style="gap:7px;flex-wrap:wrap;margin-bottom:14px">
          ${presets.filter(x=>x>0).map(x=>`<button class="chip" data-act="qaPreset" data-v="${arg}" data-arg="${x}">+ ${fmtQty(it.base,x)}</button>`).join('')}
        </div>
        <div class="grid g2" style="gap:0 12px">
          <label class="field"><span>Amount</span><input class="input" id="qaQty" type="number" step="any" placeholder="0"></label>
          <label class="field"><span>Unit</span><select class="input" id="qaUnit">
            ${(UNIT_OPTS[it.base]||['g']).map(x=>`<option value="${x}" ${x===u?'selected':''}>${UNITS[x].label}</option>`).join('')}</select></label>
        </div>
        <div class="row" style="gap:8px">
          <button class="btn primary" style="flex:1" data-act="qaApply" data-v="${arg}" data-arg="add">Add to stock</button>

/* ===========================================================================
   RENDER — the shell mounts once; only the screen body is replaced.
   The clock tick patches text nodes instead of re-rendering.
   =========================================================================== */
const SCREENS={today:ScreenToday,prep:ScreenPrep,inventory:ScreenInventory,shop:ScreenShop,jugaad:ScreenJugaad,points:ScreenPoints,
  prefs:ScreenPrefs,stack:ScreenStack,train:ScreenTrain,progress:ScreenProgress,coach:ScreenCoach,settings:ScreenSettings};
let mounted=false;
function mount(){
  $('#app').innerHTML=`${Rail()}<main class="main"><div class="wrap" id="screen"></div></main>${TabBar()}`;
  mounted=true;
}
function snapFocus(){
  const a=document.activeElement;
  return (a&&a.dataset&&a.dataset.keep)?{k:a.dataset.keep,s:a.selectionStart,e:a.selectionEnd,v:a.value}:null;
}
function restoreFocus(f){
  if(!f) return;
  const n=document.querySelector(`[data-keep="${f.k}"]`);
  if(n){ n.value=f.v; n.focus(); try{n.setSelectionRange(f.s,f.e);}catch(e){} }
}
function crashScreen(err){
  const msg=(err&&(err.message||err))+'';
  document.body.style.overflow='auto';
  $('#overlay').innerHTML='';
  $('#app').innerHTML=`<div style="max-width:520px;margin:12vh auto;padding:26px;font-family:var(--f-ui)">
    <div style="font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.03em">Something went wrong loading your data.</div>
    <p style="font-family:var(--f-talk);margin:12px 0 0;color:var(--muted);line-height:1.55">
      This is almost always saved data from an older version of the app. Resetting clears it and starts fresh.</p>
    <pre style="margin:16px 0;padding:12px;background:var(--surface-2);border-radius:12px;font-size:12px;white-space:pre-wrap;color:var(--ink-2)">${esc(msg)}</pre>
    <button class="btn primary" onclick="try{localStorage.removeItem('alphacoach.v2')}catch(e){};location.reload()">Reset saved data and reload</button>
  </div>`;
}
let raf=0;
function render(){
  if(raf) return;
  raf=requestAnimationFrame(()=>{
    raf=0;
    try{ renderNow(); }catch(err){ console.error(err); crashScreen(err); }
  });
}
function renderNow(){
  {
    if(!S.onboarded){
      const f0=snapFocus();
      $('#app').innerHTML=''; mounted=false;
      $('#overlay').innerHTML=Onboarding();
      restoreFocus(f0);
      return;
    }
    evaluateReminders();
    autoResolveStale();
    checkReplacements();
    S.ui.pointsFeed=(S.ui.pointsFeed||[]).slice(-4);
    const f=snapFocus();
    if(!mounted) mount();
    // refresh nav state cheaply
    const rail=$('.rail'), tabs=$('.tabbar');
    if(rail) rail.outerHTML=Rail();
    if(tabs) tabs.outerHTML=TabBar();
    const host=$('#screen');
    if(host) host.innerHTML=(SCREENS[S.ui.screen]||ScreenToday)();
    const hadModal=!!$('#overlay .modal');
    if(S.ui.modal&&!hadModal) lastFocus=document.activeElement;
    $('#overlay').innerHTML=Overlay();
    if(S.ui.modal) trapFocus();
    else if(hadModal&&lastFocus&&document.contains(lastFocus)){ try{ lastFocus.focus(); }catch(e){} lastFocus=null; }
    const cs=$('#chatScroll'); if(cs) cs.scrollTop=cs.scrollHeight;
    restoreFocus(f);
  }
}
function patchClocks(){
  const nx=nextRow(); if(!nx) return;
  $$('[data-clock="countdown"]').forEach(n=>{
    const st=stateOf(nx);
    n.textContent = st==='due'?'Eat now':(now()<nx.at?'in '+dur(nx.at-now()):dur(now()-nx.at)+' ago');
  });
}
let lastSig='';
function tick(){
  const d=D();
  const sig=d?activeRows().map(r=>r.meal.id+stateOf(r)).join('|')+'/'+S.ui.screen:'gate';
  const fired=evaluateReminders();
  if(sig!==lastSig||fired){ lastSig=sig; render(); }
  else patchClocks();
}

/* ===========================================================================
   ACTIONS
   =========================================================================== */
const busy=new Set();
function togPref(k,v){
  const a=S.prefs[k]||(S.prefs[k]=[]);
  const i=a.indexOf(v);
  if(i>=0) a.splice(i,1); else a.push(v);
  S.jugaad=null; save(); render();
}
/* keep the keyboard inside an open dialog, and give focus back on close */
let lastFocus=null;
function trapFocus(){
  const modal=$('#overlay .modal'); if(!modal) return;
  const sel='button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])';
  const first=modal.querySelector(sel);
  if(first&&!modal.contains(document.activeElement)) first.focus();
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Tab') return;
  const modal=$('#overlay .modal'); if(!modal) return;
  const nodes=[...modal.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(n=>!n.disabled&&n.offsetParent!==null||n.tagName==='INPUT');
  if(!nodes.length) return;
  const first=nodes[0], last=nodes[nodes.length-1];
  if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
});
function renderOverlayOnly(){
  const f=snapFocus();
  $('#overlay').innerHTML=Overlay();
  restoreFocus(f);
}
function shortageLine(s){
  const base=`You have ${fmtQty(s.base,s.have)} of ${s.name.toLowerCase()} left, but the next day needs ${fmtQty(s.base,s.need24)}.`;
  const fix=` Add at least ${fmtQty(s.base,s.buy)} to your shopping list`;
  const sub=s.subs.length?`, or use the ${s.subs[0].name.toLowerCase()} you already have for one meal.`:'.';
  return base+fix+sub;
}
const ACT={
  go(v){ if(S.ui.screen===v) return; S.ui.screen=v; S.ui.modal=null; save(); render(); const m=$('.main'); if(m) m.scrollTop=0; },
  modal(v,n){
    if(v==='replace') primeEatTimeSession(S.ui.modal!=='estimate');
    S.ui.modal=v; S.ui.modalArg=n?n.dataset.arg:null; S.ui.reason=null; render();
  },
  close(){ S.ui.modal=null; S.ui.modalArg=null; S.ui.eatTime={}; S.ui.eatTimeFull=false; render(); },
  scrim(v,n,e){ if(e.target===n) ACT.close(); },

  wake(){
    if(busy.has('wake')) return; busy.add('wake');
    const ts=now(), d=blankDay(ts);
    S.days[d.key+'@'+ts]=d; S.activeDay=d.key+'@'+ts;
    checkStreakBreak();
    S.ui.screen='today'; save(); render();
    const nx=nextRow();
    setTimeout(()=>{
      toast(`Day started at ${fmtTime(ts)}. First meal — ${nx.meal.name} — at ${fmtTime(nx.at)}.`);
      busy.delete('wake');
    },260);
  },

  /* opens the confirm-and-adjust window; nothing is deducted yet */
  eatTimeQuick(v,n){
    const kind=n.dataset.kind, loggedAt=now();
    let ts=loggedAt;
    if(kind==='30') ts=loggedAt-30*MIN;
    else if(kind==='60') ts=loggedAt-60*MIN;
    else if(kind==='meal'){
      const mealAt=mealTimeForControl(n.dataset.meal);
      if(mealAt) ts=mealAt;
    }
    rememberEatTime(v,timeInputValue(ts),kind);
    renderOverlayOnly();
  },
  eatTimeExact(v){
    const f=document.getElementById(v);
    if(!f) return;
    f.focus();
    try{ if(f.showPicker) f.showPicker(); }catch(e){}
  },
  ate(v){ S.ui.eatSkip={}; S.ui.eatAmt={}; primeEatTimeSession(true); S.ui.modal='eat'; S.ui.modalArg=v; render(); },
  togEat(v){ S.ui.eatSkip=S.ui.eatSkip||{}; S.ui.eatSkip[v]=!S.ui.eatSkip[v]; renderOverlayOnly(); },

  async confirmEat(v,n){
    if(busy.has(v)) return; busy.add(v);
    const d=D(); if(!d){busy.delete(v);return;}
    const row=activeRows().find(r=>r.meal.id===v);
    if(!row||row.status!=='pending'||!isOpen(row)){busy.delete(v);return;}
    const noDeduct=n&&n.dataset.arg==='nodeduct';
    const use=[];
    if(!noDeduct){
      mealItems(row.meal).forEach(i=>{
        if(S.ui.eatSkip&&S.ui.eatSkip[i.ref]) return;
        const f=document.querySelector(`[data-eatamt="${i.ref}"]`);
        const stored=S.ui.eatAmt&&S.ui.eatAmt[i.ref];
        const amt=f?(+f.value||0):(stored!=null?+stored:i.amt);
        if(amt>0) use.push({ref:i.ref,amt});
      });
    }
    const loggedAt=now();
    // the actual eating time the user confirmed, which may not be now
    const {ateAt,timeConfirmed}=readAteTimeInput('#eatTime',d,loggedAt);
    S.ui.modal=null; S.ui.eatTime={}; S.ui.eatTimeFull=false; S.ui.celebrate=v; render();
    await AlphaAPI.logMeal({mealId:v,ateAt,loggedAt,plannedAt:row.at,consumed:use});
    setTimeout(()=>{
      if(d.logs[v]){ busy.delete(v); return; }
      const res=commitMeal({mealId:v, ateAt, loggedAt, use:noDeduct?[]:use, timeConfirmed});
      S.ui.celebrate=null;
      if(!res.ok){ busy.delete(v); toast(res.msg); render(); return; }
      const msg=explainShift(row,ateAt);
      d.notes.push({at:now(),text:msg});
      const nx=nextRow();
      if(nx) S.ui.unlocked=nx.meal.id;
      save(); render();
      pointsToast(res.entries);
      setTimeout(()=>toast(msg),700);
      setTimeout(()=>{ S.ui.unlocked=null; render(); },1600);
      const s2=shortages().filter(x=>use.some(u=>u.ref===x.ref));
      if(s2.length) setTimeout(()=>toast(shortageLine(s2[0])),1500);
      busy.delete(v);
    },520);
  },

  saveAteTime(v){
    const f=$('#etTime'); if(!f||!f.value) return;
    const [h,mi]=f.value.split(':').map(Number);
    const dt=new Date(now()); dt.setHours(h,mi,0,0);
    let ts=dt.getTime(); if(ts>now()+5*MIN) ts-=864e5;
    const res=editAteTime(v,ts);
    S.ui.modal=null;
    if(!res.ok){ toast(res.msg); render(); return; }
    const nx=res.nx;
    if(nx&&stateOf(nx)!=='upcoming') S.ui.unlocked=nx.meal.id;
    render();
    const moved=res.moved.length;
    toast(`${mealById(v).name} set to ${fmtTime(res.newAte)} (was ${fmtTime(res.prevAte)}).`+
      (moved?` ${moved} later meal${moved>1?'s':''} recalculated${nx?` — ${nx.meal.name.toLowerCase()} now ${fmtTime(nx.at)}`:''}.`:''));
    if(res.lateCorrection) setTimeout(()=>toast(`${RULES.LATE_CORRECTION.pts} — the schedule had already moved on when you corrected this.`),900);
    setTimeout(()=>{ S.ui.unlocked=null; render(); },1700);
  },

  unmiss(v){
    const d=D(); if(!d) return;
    const log=d.logs[v]; if(!log||log.status!=='missed') return;
    Points.voidAward('MEAL_NEVER_LOGGED',v);
    delete d.logs[v];
    d.reopened=d.reopened||{}; d.reopened[v]=true;
    save(); render();
    primeEatTimeSession(true); S.ui.modal='eat'; S.ui.modalArg=v; S.ui.eatSkip={}; S.ui.eatAmt={};
    render();
    toast('Reopened — set the time you actually ate it.');
  },
  keepOriginal(v){
    const d=D(); if(!d) return;
    d.keepOriginal=d.keepOriginal||{};
    d.keepOriginal[v]=true;
    if(d.autoSwap) delete d.autoSwap[v];
    save(); render();
    toast(`Keeping the original ${mealById(v).name.toLowerCase()}. Missing items stay on your shopping list.`);
  },

  /* ---------- reward ---------- */
  openReward(){
    if(Points.coolingDown())
      return toast(`You passed on the last one. The next surprise opens in ${dur(Points.cooldownLeft())} — your points are safe until then.`);
    if(!Points.rewardReady()) return toast(`${REWARD_TARGET-Points.towardReward()} more points to go.`);
    const r=pickSurprise();
    if(!r) return toast('No new recipe fits your restrictions right now.');
    S.points.pending=r; S.ui.modal='reward'; save(); render();
  },
  rewardChoice(v,n){
    const id=n.dataset.arg, r=SURPRISE.find(x=>x.id===id);
    if(v==='no'){
      S.points.declined=[...(S.points.declined||[]),id];
      S.points.declineUntil=now()+REROLL_COOLDOWN;
      S.points.pending=null; S.ui.modal=null; save(); render();
      toast(`Noted — that one is off the list. Your points stay banked and the next surprise opens in ${dur(REROLL_COOLDOWN)}.`);
      return;
    }
    S.points.unlocked=[...(S.points.unlocked||[]),{id,at:now(),choice:v}];
    S.points.spent=(S.points.spent||0)+REWARD_TARGET;
    S.points.pending=null; S.ui.modal=null; save(); render();
    toast(v==='make'?`${r.name} saved to your recipes. Nothing was added to today's plan.`:`Saved for later. It stays in your recipes.`);
  },
  rewardShop(v,n){
    const r=SURPRISE.find(x=>x.id===n.dataset.arg); if(!r) return;
    surpriseStock(r).filter(x=>!x.ok).forEach(x=>{
      S.shop[x.ref]=Object.assign({},S.shop[x.ref],{removed:false,qty:Math.max(buyQty(x.ref),(CATALOG[x.ref]||{pack:1}).pack)});
    });
    save(); render(); toast('Missing items added to your shopping list.');
  },

  water(v){
    const d=D(); if(!d) return toast('Start your day first.');
    d.water=Math.max(0,(d.water||0)+ +v); save(); render();
  },
  saveWeight(){
    const f=$('#wtKg'); const kg=f?+f.value:0;
    if(!kg) return toast('Enter a number.');
    S.weights=S.weights||[];
    const prev=S.weights[S.weights.length-1];
    S.weights.push({at:now(),kg});
    S.ui.modal=null; save(); render();

async function sendMsg(text){
  S.chat.push({r:'me',t:esc(text)});
  S.ui.chatBusy=true; S.ui.screen='coach'; S.ui.chatConfirm=null; save(); render();
  await new Promise(r=>setTimeout(r,340));

  const ops=parseCommand(text);
  const risky=ops.filter(o=>o.risky);
  let reply;

  if(risky.length){
    // anything destructive gets confirmed first
    S.ui.chatConfirm={ops, question:describeRisky(risky)};
    reply=`Before I do that — ${describeRisky(risky)}`;
  } else if(ops.every(o=>o.kind==='unknown')){
    reply=IN_SCOPE.test(text)
      ? `I did not catch a specific action there. Try something like “I ate lunch at 1pm”, “add 500 g paneer”, “replace dinner” or “how many points today?”.`
      : `I only handle your food, training, inventory and schedule inside this app. Ask me about today's meals, your stock, or your points and I will be useful.`;
  } else {
    // a real model would return these same ops; for now the parser produces them
    const remote=await AlphaAPI.interpret(text,snapshotForAI());
    const lines=runOps(remote&&remote.ops?remote.ops:ops);
    reply=lines.join('<br><br>');
    save();
  }
  S.ui.chatBusy=false;
  S.chat.push({r:'ai',t:reply});
  save(); render();
}
function describeRisky(risky){
  const o=risky[0];
  if(o.kind==='inv') return `that clears <b>${esc(catName(o.ref))}</b> down to zero. Confirm?`;
  if(o.kind==='skipMeal') return `that marks <b>${esc(o.row?o.row.meal.name:'the meal')}</b> as skipped, which affects your score. Confirm?`;
  return `that is a change I would rather double-check. Confirm?`;
}
/* everything the AI is allowed to see — read-only, points included but not writable */
function snapshotForAI(){
  const d=D();
  return {
    wake:d?d.wake:null,
    rows:d?activeRows().map(r=>({id:r.meal.id,name:r.meal.name,at:r.at,status:r.status,locked:isLocked(r)})):[],
    inventory:invItems().map(i=>({ref:i.ref,qty:i.qty,base:i.base})),
    prefs:S.prefs,
    points:{positive:Points.positive(),negative:Points.negative(),streak:Points.streak(),
            toward:Points.towardReward(),target:REWARD_TARGET},
    shortages:shortages().map(x=>({ref:x.ref,have:x.have,need:x.need24}))
  };
}

  const t=e.target;

  if(t.dataset.set==='api'){ AlphaAPI.base=t.value.trim()||null; S.ui.online=true; }
  if(t.dataset.ob){
    const k=t.dataset.ob;
    if(k==='name') S.name=t.value;
    else S.prefs[k]=NUM_PREFS.includes(k)?(+t.value||0):t.value;
    save();
  }
  if(t.dataset.eatamt){ S.ui.eatAmt=S.ui.eatAmt||{}; S.ui.eatAmt[t.dataset.eatamt]=t.value; }
  if(t.dataset.eatTime&&t.value) rememberEatTime(t.dataset.eatTime,t.value,'exact');
  if(t.dataset.pref){
    const k=t.dataset.pref;
    S.prefs[k]=NUM_PREFS.includes(k)?(+t.value||0):t.value;
    save();
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.eatTime&&t.value){
    rememberEatTime(t.dataset.eatTime,t.value,'exact');
    renderOverlayOnly();
    return;
  }
  if(t.dataset&&t.dataset.photo==='est'&&t.files&&t.files[0]){
    const fr=new FileReader();
    fr.onload=async()=>{
      S.ui.estPhoto=fr.result;
      renderOverlayOnly();
      const items=await AlphaAPI.recogniseMeal(fr.result);
      if(items&&items.length){
        const it=items[0];
        S.ui.estGuess=it;
        const k=$('#estK'), p=$('#estP');
        if(k) k.value=it.kcal; if(p) p.value=it.protein;
        toast(`Read the plate: ${it.name}, about ${it.kcal} kcal.`);
      }else{
        toast('Photo saved. No vision model connected yet — pick the closest dish below.');
      }
    };
    fr.readAsDataURL(t.files[0]);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='chatInput'){ e.preventDefault(); ACT.send(); }
  if(e.key==='Escape'&&S.ui.modal) ACT.close();
});
window.addEventListener('online',()=>{S.ui.online=true;render();});
window.addEventListener('offline',()=>{S.ui.online=false;render();toast('You are offline. Everything is saved locally and will sync later.');});

function applyTheme(){
  try{ document.documentElement.setAttribute('data-theme', S.theme||'grove'); }catch(e){}
}

/* ---------- boot ---------- */
applyTheme();
window.addEventListener('error',e=>{ const a=$('#app'); if(a&&!a.innerHTML) crashScreen(e.error||e.message); });
setInterval(()=>{ try{ tick(); }catch(e){ console.error(e); } },10000);
try{ render(); }catch(e){ console.error(e); crashScreen(e); }
setTimeout(()=>{ try{ evaluateReminders(); }catch(e){ console.error(e); } },400);
