<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">Alpha Coach Ember mascot milestone states</title>
  <desc id="desc">Static design comp showing idle, wake, cheer, concern, and rest mascot states tied to adherence milestones.</desc>
  <style>
    :root {
      --bg: #F2F4E8;
      --surface: #FFFFFF;
      --surface-2: #F4F6EC;
      --ink: #141A0F;
      --ink-2: #3E463A;
      --muted: #727A6B;
      --line: rgba(20,26,15,.12);
      --accent: #2F5D34;
      --accent-ink: #1D3D21;
      --accent-soft: rgba(47,93,52,.08);
      --lime: #C6E85C;
      --ember: #C85E2C;
      --peach: #F8CDA0;
      --mascot-body: var(--peach);
      --mascot-body-2: var(--surface-2);
      --mascot-line: var(--accent-ink);
      --mascot-panel: var(--ink-2);
      --mascot-eye: var(--lime);
      --mascot-arc-off: rgba(20,26,15,.14);
    }
    text { font-family: "DM Sans", Arial, sans-serif; fill: var(--ink); }
    .page { fill: var(--bg); }
    .card { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .kicker { fill: var(--ember); font-size: 13px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .title { font-size: 34px; font-weight: 900; letter-spacing: -.04em; }
    .label { font-size: 20px; font-weight: 900; letter-spacing: -.02em; }
    .body { fill: var(--muted); font-size: 14px; font-weight: 650; }
    .small { fill: var(--muted); font-size: 12px; font-weight: 650; }
    .pill { fill: var(--accent-soft); stroke: rgba(47,93,52,.22); }
    .pillText { fill: var(--accent-ink); font-size: 12px; font-weight: 800; }
    .m-ground { fill: var(--ink); opacity: .07; }
    .m-head,.m-arm,.m-hand { fill: var(--mascot-body); stroke: var(--mascot-line); stroke-width: 1.7; }
    .m-torso,.m-leg,.m-foot { fill: var(--mascot-body-2); stroke: var(--mascot-line); stroke-width: 1.7; }
    .m-sash,.m-chip { fill: var(--mascot-panel); }
    .m-neck { fill: var(--mascot-line); }
    .m-eye { fill: var(--mascot-eye); stroke: var(--mascot-line); stroke-width: 1.7; }
    .m-mouth { fill: none; stroke: var(--mascot-line); stroke-width: 2.4; stroke-linecap: round; }
    .m-lid { fill: var(--mascot-line); opacity: 0; }
    .m-arc { transform-origin: 150px 190px; }
    .m-arc path { fill: none; stroke-linecap: round; stroke-width: 11; }
    .arc-bg { stroke: var(--mascot-arc-off); opacity: .9; }
    .arc-fg { stroke: var(--accent); stroke-dasharray: 1; }
    .state-wake .m-body { transform: translateY(-9px) scale(1.015); transform-origin: 150px 350px; }
    .state-cheer .m-body { transform: translateY(-18px) scale(1.035); transform-origin: 150px 350px; }
    .state-cheer .arc-fg { stroke: var(--lime); }
    .state-concern .m-body { transform: rotate(-2deg) translateX(-3px); transform-origin: 150px 320px; }
    .state-concern .m-mouth { transform: translateY(4px) scaleY(.7); transform-origin: 154px 98px; }
    .state-concern .arc-fg { stroke: var(--ember); }
    .state-rest .m-lid { opacity: .86; }
    .state-rest .m-body { transform: translateY(6px) scale(.985); transform-origin: 150px 350px; }
  </style>
  <rect class="page" width="1400" height="840"/>
  <text class="kicker" x="64" y="72">Alpha Coach design comp</text>
  <text class="title" x="64" y="112">Ember milestone states</text>
  <text class="body" x="64" y="142">Use the existing inline SVG geometry. Change state through classes, arc progress, and small transform/opacity shifts only.</text>

  <defs>
    <g id="ember">
      <g class="m-arc m-arc--fuel">
        <path class="arc-bg" pathLength="1" d="M38 136A124 124 0 0 1 262 136"/>
        <path class="arc-fg" pathLength="1" stroke-dashoffset=".24" d="M38 136A124 124 0 0 1 262 136"/>
      </g>
      <g class="m-arc m-arc--protein">
        <path class="arc-bg" pathLength="1" d="M28 222A108 108 0 0 1 38 158"/>
        <path class="arc-fg" pathLength="1" stroke-dashoffset=".48" d="M28 222A108 108 0 0 1 38 158"/>
      </g>
      <g class="m-arc m-arc--discipline">
        <path class="arc-bg" pathLength="1" d="M272 222A108 108 0 0 0 262 158"/>
        <path class="arc-fg" pathLength="1" stroke-dashoffset=".18" d="M272 222A108 108 0 0 0 262 158"/>
      </g>
      <ellipse class="m-ground" cx="150" cy="356" rx="76" ry="7"/>
      <g class="m-body">
        <path class="m-leg m-leg-a" d="M112 236h34l-7 94c-.6 9-6 14-16 14s-16-5-15-14l4-94Z"/>
        <path class="m-leg m-leg-b" d="M154 236h34l4 94c1 9-5 14-15 14s-15.4-5-16-14l-7-94Z"/>
        <path class="m-foot" d="M96 330h44v14H90l6-14Z"/>
        <path class="m-foot" d="M160 330h44l6 14h-50v-14Z"/>
        <path class="m-torso" d="M150 122c-28 0-48 13-54 36l-12 62c-3 17 7 29 24 29h84c17 0 27-12 24-29l-12-62c-6-23-26-36-54-36Z"/>
        <path class="m-sash" d="M98 150l100 44-5 18-96-44 1-18Z"/>
        <path class="m-arm m-arm-a" d="M98 148c-16 9-24 22-27 39l-8 45c-2 10 5 17 15 17 9 0 15-6 17-16l12-69-9-16Z"/>
        <path class="m-arm m-arm-b" d="M202 148c16 9 24 22 27 39l8 45c2 10-5 17-15 17-9 0-15-6-17-16l-12-69 9-16Z"/>
        <path class="m-hand" d="M62 239c-15 0-25 10-25 25 0 18 12 31 30 31 15 0 26-9 26-24 0-20-11-32-31-32Z"/>
        <path class="m-hand" d="M238 239c15 0 25 10 25 25 0 18-12 31-30 31-15 0-26-9-26-24 0-20 11-32 31-32Z"/>
        <path class="m-neck" d="M130 105h40v24h-40z"/>
        <path class="m-head" d="M143 31c32-5 55 15 57 42 2 28-22 45-50 45-29 0-49-19-49-43 0-25 17-40 42-44Z"/>
        <path class="m-chip" d="M178 28l20 16-14 17-15-18 9-15Z"/>
        <path class="m-eye" d="M116 75l18-9 19 8-18 10-19-9Z"/>
        <path class="m-eye" d="M165 74l19-8 18 9-19 9-18-10Z"/>
        <path class="m-lid" d="M116 75l18-9 19 8-18 10-19-9Z"/>
        <path class="m-lid" d="M165 74l19-8 18 9-19 9-18-10Z"/>
        <path class="m-mouth" d="M139 98c8 5 22 5 30-1"/>
      </g>
    </g>
  </defs>

  <g transform="translate(54 188)">
    <rect class="card" width="245" height="548" rx="24"/>
    <g transform="translate(28 28) scale(.62)" class="state-idle"><use href="#ember"/></g>
    <text class="label" x="28" y="308">Idle</text>
    <text class="body" x="28" y="336">Ordinary progress</text>
    <text class="small" x="28" y="362">Fires between actions.</text>
    <text class="small" x="28" y="386">Static: neutral pose, current arcs.</text>
    <rect class="pill" x="28" y="424" width="128" height="30" rx="15"/>
    <text class="pillText" x="44" y="444">baseline</text>
  </g>
  <g transform="translate(320 188)">
    <rect class="card" width="245" height="548" rx="24"/>
    <g transform="translate(28 28) scale(.62)" class="state-wake"><use href="#ember"/></g>
    <text class="label" x="28" y="308">Wake</text>
    <text class="body" x="28" y="336">Day starts</text>
    <text class="small" x="28" y="362">Fires after "I'm awake".</text>
    <text class="small" x="28" y="386">Static: lifted, eyes open.</text>
    <rect class="pill" x="28" y="424" width="132" height="30" rx="15"/>
    <text class="pillText" x="44" y="444">re-derived</text>
  </g>
  <g transform="translate(586 188)">
    <rect class="card" width="245" height="548" rx="24"/>
    <g transform="translate(28 28) scale(.62)" class="state-cheer"><use href="#ember"/></g>
    <text class="label" x="28" y="308">Cheer</text>
    <text class="body" x="28" y="336">On-time adherence</text>
    <text class="small" x="28" y="362">Fires on logged meal, streak, reward.</text>
    <text class="small" x="28" y="386">Static: high body, full bright arcs.</text>
    <rect class="pill" x="28" y="424" width="118" height="30" rx="15"/>
    <text class="pillText" x="44" y="444">earned</text>
  </g>
  <g transform="translate(852 188)">
    <rect class="card" width="245" height="548" rx="24"/>
    <g transform="translate(28 28) scale(.62)" class="state-concern"><use href="#ember"/></g>
    <text class="label" x="28" y="308">Concern</text>
    <text class="body" x="28" y="336">Action needed</text>
    <text class="small" x="28" y="362">Fires for late or compression risk.</text>
    <text class="small" x="28" y="386">Static: small lean, ember arc.</text>
    <rect class="pill" x="28" y="424" width="124" height="30" rx="15"/>
    <text class="pillText" x="44" y="444">no shame</text>
  </g>
  <g transform="translate(1118 188)">
    <rect class="card" width="245" height="548" rx="24"/>
    <g transform="translate(28 28) scale(.62)" class="state-rest"><use href="#ember"/></g>
    <text class="label" x="28" y="308">Rest</text>
    <text class="body" x="28" y="336">Day closed</text>
    <text class="small" x="28" y="362">Fires before wake or after bedtime.</text>
    <text class="small" x="28" y="386">Static: lids down, arcs quiet.</text>
    <rect class="pill" x="28" y="424" width="106" height="30" rx="15"/>
    <text class="pillText" x="44" y="444">settled</text>
  </g>
</svg>
